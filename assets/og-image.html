<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0A1120;
    font-family: 'Outfit', ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  .canvas {
    position: relative;
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(680px 420px at 82% 18%, rgba(110,147,255,0.22), transparent 60%),
      linear-gradient(180deg, #0B1424 0%, #0A1120 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 96px;
  }
  .grid-lines {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(242,238,227,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(242,238,227,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: linear-gradient(180deg, transparent, black 30%, black 70%, transparent);
  }
  .mark {
    width: 88px;
    height: 88px;
    border-radius: 18px;
    background: #0A0A0A;
    border: 1px solid rgba(242,238,227,0.14);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
  }
  .mark svg { width: 42px; height: 42px; }
  .eyebrow {
    font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    font-size: 22px;
    color: #6E93FF;
    letter-spacing: 0.06em;
    margin-bottom: 22px;
  }
  h1 {
    font-size: 68px;
    font-weight: 800;
    color: #F2EEE3;
    line-height: 1.08;
    letter-spacing: -0.02em;
    max-width: 900px;
  }
  .sub {
    margin-top: 26px;
    font-size: 27px;
    color: #C7C1B2;
    font-weight: 400;
    max-width: 760px;
  }
  .wordmark {
    position: absolute;
    top: 64px;
    right: 96px;
    font-weight: 700;
    font-size: 24px;
    color: #F2EEE3;
    letter-spacing: -0.01em;
  }
  .wordmark span { color: #6E93FF; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="grid-lines"></div>
    <div class="wordmark">DIRECTOR<span> IA</span></div>
    <div class="mark">
      <svg viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M13 9 L21 17 L13 25" stroke="#F5F1E8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="eyebrow">&gt; dirige tu negocio con inteligencia</p>
    <h1>El futuro no se espera.<br>Se automatiza.</h1>
    <p class="sub">Agentes de IA, automatización y chatbots para tu negocio.</p>
  </div>
</body>
</html>
